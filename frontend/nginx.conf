server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Soporte para Vue Router (history mode) - redirige todo al index.html
    # Sin caché para el HTML principal para que cualquier deploy o cambio de versión se refleje al instante
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Desactivar caché explícitamente en index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache para activos estáticos compilados por Vite con hash único (JS, CSS)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache para imágenes y media estáticos
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 6M;
        add_header Cache-Control "public";
    }

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
